(function themeToggle() {
  const btn  = document.getElementById('theme-toggle');
  const html = document.documentElement;

  const saved = localStorage.getItem('bh-theme') || 'dark';
  html.setAttribute('data-theme', saved);
  btn.textContent = saved === 'dark' ? '[9aba7 mode]' : '[Masa2 mode]';

  btn.addEventListener('click', () => {
    const current = html.getAttribute('data-theme') || 'dark';
    const next    = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('bh-theme', next);
    btn.textContent = next === 'dark' ? '[9aba7 mode]' : '[Masa2 mode]';

})();

const container = document.getElementById('typer-container');
const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));

let activeCursor = null;

function createPrompt(user = "dana_alakail") {
  if (activeCursor) activeCursor.remove();

  activeCursor = document.createElement('span');
  activeCursor.className = 'cursor';
  
  line.appendChild(textNode);
  line.appendChild(activeCursor);
  container.appendChild(line);
  window.scrollTo(0, document.body.scrollHeight);
  
  return textNode;
}

function printHtml(html) {
  const div = document.createElement('div');
  div.className = 'cmd-output';
  div.innerHTML = html;
  container.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

// Executes a sequence of keystrokes
async function humanType(node, sequence) {
  if (activeCursor) activeCursor.classList.add('static');
  
  for (let action of sequence) {
    if (typeof action === 'string') {
      for (let char of action) {
        node.textContent += char;
        await sleep(Math.random() * 40 + 40); // 40-80ms per char
      }
    } else if (typeof action === 'number') {
      if (action < 0) {
        let count = Math.abs(action);
        for (let i = 0; i < count; i++) {
          node.textContent = node.textContent.slice(0, -1);
          await sleep(60);
        }
      } else {
        await sleep(action);
      }
    }
  }
  
  if (activeCursor) activeCursor.classList.remove('static');
  await sleep(200); // pause before enter
}

function disableButtons(clickedBtn) {
  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach(b => {

  printHtml(`[sudo] switching user to danas_guest...<br>interactive shell loaded. <span class="color-dim">// ↑ ↓ arrow keys navigate history. type <b>help</b> to see commands.</span>`);
  await sleep(400);

  spawnRealInput();
}

function spawnRealInput() {
  if (activeCursor) activeCursor.remove();
  
  const line = document.createElement('div');
  line.className = 'prompt-line';
  line.innerHTML = `<span class="p-user">danas_guest</span><span class="p-sep">@</span><span class="p-host">riyadh</span><span class="p-sep">:</span><span class="p-path">~</span><span class="p-dollar"> $</span>`;
  
  const input = document.createElement('input');
  input.type = 'text';
  input.id = 'real-input';
  input.autocomplete = 'off';
  input.spellcheck = false;
  
  line.appendChild(input);
  container.appendChild(line);
  
  input.focus();
  window.scrollTo(0, document.body.scrollHeight);

  // Prevent losing focus easily
  document.addEventListener('click', () => input.focus());

  input.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') {
      const val = this.value.trim();
      
      const staticText = document.createElement('span');
      staticText.className = 'type-text';
      staticText.textContent = val;
      line.replaceChild(staticText, this);
      
      processCommand(val);
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      if (historyIndex < commandHistory.length - 1) {
        historyIndex++;
        this.value = commandHistory[commandHistory.length - 1 - historyIndex];
      }
    } else if (e.key === 'ArrowDown') {
      e.preventDefault();
      if (historyIndex > 0) {
        historyIndex--;
        this.value = commandHistory[commandHistory.length - 1 - historyIndex];
      } else if (historyIndex === 0) {
        historyIndex = -1;
        this.value = '';
      }
    }
  });
}

function processCommand(cmdRaw) {
  const cmd = cmdRaw.toLowerCase();
  
  if (cmd !== '') {
    commandHistory.push(cmdRaw);
    historyIndex = -1;
  }

  let output = "";

  switch(cmd) {
    case 'whoami': case 'about': case 'profile':
      output = `${cvData.whoami}<br>${cvData.profile}`;
      break;
    case 'education': case 'edu':
      output = cvData.education;
      break;
    case 'projects': case 'project':
      output = cvData.projects;
      break;
    case 'leadership': case 'volunteering':
      output = cvData.leadership;
      break;
    case 'certs': case 'certificates': case 'certifications':
      output = cvData.certs;
      break;
    case 'skills': case 'languages': case 'env':
      output = cvData.skills;
      break;
    case 'ls': 
      output = `<div class="block-margin"><span class="color-accent">Al-Khokha_Source/</span> &nbsp;&nbsp;&nbsp; <span class="color-accent">Automation_Scripts/</span> &nbsp;&nbsp;&nbsp; <span class="color-accent">CTF_Challenges/</span><br><span class="color-dim">cv.html &nbsp;&nbsp;&nbsp; contact.html &nbsp;&nbsp;&nbsp; index.html</span></div>`;
      break;
    case 'pwd':
      output = `<div class="block-margin color-dim">/home/danas_guest</div>`;
      break;
    case 'cd':
      output = `<div class="color-error block-margin">bash: cd: restricted shell environment.</div>`;
      break;
    case 'help':
      output = `<div class="block-margin">Available commands:<br>
  <span class="prompt-exec">&gt;&gt;</span> <span class="color-strong">whoami</span>     (Profile & Contact)<br>
  <span class="prompt-exec">&gt;&gt;</span> <span class="color-strong">education</span>  (Academic history)<br>
  <span class="prompt-exec">&gt;&gt;</span> <span class="color-strong">projects</span>   (Technical portfolio)<br>
  <span class="prompt-exec">&gt;&gt;</span> <span class="color-strong">leadership</span> (Club operations)<br>
  <span class="prompt-exec">&gt;&gt;</span> <span class="color-strong">certs</span>      (Certifications)<br>
  <span class="prompt-exec">&gt;&gt;</span> <span class="color-strong">skills</span>     (Technical stack)<br>
  <span class="prompt-exec">&gt;&gt;</span> <span class="color-strong">ls, pwd, cd</span>(System exploration)<br>
  <span class="prompt-exec">&gt;&gt;</span> <span class="color-error">clear</span>      (Clear terminal)</div>`;
      break;
    case 'clear':
      container.innerHTML = '';
      spawnRealInput();
      return; 
    case '':
      break;
    default:
      output = `<div class="color-error block-margin">bash: ${cmdRaw}: command not found. Type 'help' to see available commands.</div>`;
  }

  if (output !== "") {
    printHtml(output);
  }
  
  spawnRealInput();
}

/* ============================================================
   STARTUP TRIGGER
============================================================ */
window.onload = async () => {
  const choice = await bootSequence();
  if (choice === 'static') {
    await runStaticMode();
  } else {
    await runInteractiveMode();
  }
};
